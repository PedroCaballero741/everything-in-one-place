<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f57c00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e65100;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3584e4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c71d8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Base Calendar Backing -->
  <rect x="16" y="24" width="96" height="88" rx="18" fill="#ffffff" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.15))"/>
  
  <!-- Calendar Header Bar (Moodle Orange) -->
  <path d="M 16 42 Q 16 24 34 24 L 94 24 Q 112 24 112 42 L 112 48 L 16 48 Z" fill="url(#grad1)"/>

  <!-- Calendar Rings / Pins -->
  <rect x="34" y="16" width="8" height="16" rx="4" fill="#5e5c64"/>
  <rect x="86" y="16" width="8" height="16" rx="4" fill="#5e5c64"/>

  <!-- Graduation Cap (Moodle Accent) in Header -->
  <path d="M 64 28 L 76 34 L 64 40 L 52 34 Z" fill="#ffffff"/>
  <path d="M 57 37 L 57 41 Q 64 45 71 41 L 71 37" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Calendar Grid Dots / Tasks -->
  <circle cx="36" cy="64" r="5" fill="#e0e0e0"/>
  <circle cx="55" cy="64" r="5" fill="#e0e0e0"/>
  <circle cx="73" cy="64" r="5" fill="#f57c00"/>
  <circle cx="92" cy="64" r="5" fill="#e0e0e0"/>

  <circle cx="36" cy="80" r="5" fill="#3584e4"/>
  <circle cx="55" cy="80" r="5" fill="#e0e0e0"/>
  <circle cx="73" cy="80" r="5" fill="#26a269"/>
  <circle cx="92" cy="80" r="5" fill="#e0e0e0"/>

  <circle cx="36" cy="96" r="5" fill="#e0e0e0"/>
  <circle cx="55" cy="96" r="5" fill="#e01b24"/>
  <circle cx="73" cy="96" r="5" fill="#e0e0e0"/>
  <circle cx="92" cy="96" r="5" fill="#e0e0e0"/>

  <!-- Small Notification Bell Accent Badge -->
  <circle cx="96" cy="96" r="16" fill="url(#grad2)"/>
  <path d="M 96 88 C 93 88 91 90 91 93 L 90 98 L 88 100 L 104 100 L 102 98 L 101 93 C 101 90 99 88 96 88 Z" fill="#ffffff"/>
  <circle cx="96" cy="102" r="1.5" fill="#ffffff"/>
</svg>
